<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
}


/* 音乐按钮 */

#musicButton{

    position:fixed;

    right:25px;

    bottom:25px;


    width:60px;

    height:60px;


    border-radius:50%;


    border:1px solid rgba(255,255,255,0.5);


    background:rgba(255,255,255,0.18);


    backdrop-filter:blur(12px);


    color:white;


    font-size:28px;


    cursor:pointer;


    display:flex;

    align-items:center;

    justify-content:center;


    transition:0.3s;


}



/* 鼠标悬停 */

#musicButton:hover{

    transform:scale(1.1);

    background:rgba(255,255,255,0.35);

}


/* 播放旋转效果 */

.playing{

    animation:rotate 3s linear infinite;

}


@keyframes rotate{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


</style>


</head>



<body>


<audio id="bgMusic" loop preload="auto">

<source 
src="https://h2027125863-lgtm.github.io/readymag-music1/flow.mp3"
type="audio/mpeg">

</audio>



<button id="musicButton">

♫

</button>



<script>


const music=document.getElementById("bgMusic");

const button=document.getElementById("musicButton");


let isPlaying=false;



button.onclick=function(){


if(!isPlaying){


music.play();


button.innerHTML="Ⅱ";


button.classList.add("playing");


isPlaying=true;


}

else{


music.pause();


button.innerHTML="♫";


button.classList.remove("playing");


isPlaying=false;


}


};



</script>


</body>

</html>
